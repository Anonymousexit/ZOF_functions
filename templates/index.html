<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOF Solver - Zero of Functions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .method-selector {
            margin-bottom: 30px;
        }

        .method-selector label {
            display: block;
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .method-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .method-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .input-group input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .solve-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .solve-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .solve-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 40px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-summary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .result-summary h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .result-item strong {
            font-weight: 600;
        }

        .iterations-table {
            overflow-x: auto;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .iterations-table h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box strong {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔢 ZOF Solver</h1>
            <p>Zero of Functions - Numerical Methods Calculator</p>
        </div>

        <div class="content">
            <div class="method-selector">
                <label for="method">Select Numerical Method:</label>
                <select id="method" onchange="updateInputFields()">
                    <option value="">-- Choose a method --</option>
                    <option value="bisection">Bisection Method</option>
                    <option value="regula_falsi">Regula Falsi (False Position)</option>
                    <option value="secant">Secant Method</option>
                    <option value="newton_raphson">Newton-Raphson Method</option>
                    <option value="fixed_point">Fixed Point Iteration</option>
                    <option value="modified_secant">Modified Secant Method</option>
                </select>
            </div>

            <div id="methodInfo" class="info-box" style="display: none;"></div>

            <div id="inputFields" class="input-section"></div>

            <button class="solve-btn" onclick="solveEquation()" id="solveBtn" disabled>
                Solve Equation
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Calculating...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="results" id="results">
                <div class="result-summary" id="resultSummary"></div>
                <div class="iterations-table">
                    <h3>Iteration Details</h3>
                    <div style="overflow-x: auto;">
                        <table id="iterationsTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const methodDescriptions = {
            bisection: "Requires two initial guesses [a, b] where f(a) and f(b) have opposite signs.",
            regula_falsi: "Similar to bisection but uses linear interpolation for better convergence.",
            secant: "Requires two initial guesses x₀ and x₁. Does not require derivative.",
            newton_raphson: "Requires one initial guess. Uses derivative for fast convergence.",
            fixed_point: "Requires g(x) such that x = g(x). Equation must be rearranged.",
            modified_secant: "Requires initial guess and small delta (δ) value."
        };

        function updateInputFields() {
            const method = document.getElementById('method').value;
            const inputFields = document.getElementById('inputFields');
            const solveBtn = document.getElementById('solveBtn');
            const methodInfo = document.getElementById('methodInfo');
            
            if (!method) {
                inputFields.innerHTML = '';
                solveBtn.disabled = true;
                methodInfo.style.display = 'none';
                return;
            }

            methodInfo.style.display = 'block';
            methodInfo.innerHTML = `<strong>Info:</strong> ${methodDescriptions[method]}`;
            solveBtn.disabled = false;

            let html = '';

            // Common fields
            html += `
                <div class="input-group">
                    <label>Equation f(x):</label>
                    <input type="text" id="equation" placeholder="e.g., x**3 - x - 2">
                </div>
            `;

            // Method-specific fields
            if (method === 'bisection' || method === 'regula_falsi') {
                html += `
                    <div class="input-group">
                        <label>Initial guess a:</label>
                        <input type="number" id="a" step="any" placeholder="e.g., 1">
                    </div>
                    <div class="input-group">
                        <label>Initial guess b:</label>
                        <input type="number" id="b" step="any" placeholder="e.g., 2">
                    </div>
                `;
            } else if (method === 'secant') {
                html += `
                    <div class="input-group">
                        <label>Initial guess x₀:</label>
                        <input type="number" id="x0" step="any" placeholder="e.g., 1">
                    </div>
                    <div class="input-group">
                        <label>Initial guess x₁:</label>
                        <input type="number" id="x1" step="any" placeholder="e.g., 2">
                    </div>
                `;
            } else if (method === 'newton_raphson') {
                html += `
                    <div class="input-group">
                        <label>Initial guess x₀:</label>
                        <input type="number" id="x0" step="any" placeholder="e.g., 1.5">
                    </div>
                `;
            } else if (method === 'fixed_point') {
                html += `
                    <div class="input-group">
                        <label>Function g(x):</label>
                        <input type="text" id="g_equation" placeholder="e.g., (x + 2)**(1/3)">
                    </div>
                    <div class="input-group">
                        <label>Initial guess x₀:</label>
                        <input type="number" id="x0" step="any" placeholder="e.g., 1.5">
                    </div>
                `;
            } else if (method === 'modified_secant') {
                html += `
                    <div class="input-group">
                        <label>Initial guess x₀:</label>
                        <input type="number" id="x0" step="any" placeholder="e.g., 1.5">
                    </div>
                    <div class="input-group">
                        <label>Delta (δ):</label>
                        <input type="number" id="delta" step="any" placeholder="e.g., 0.01">
                    </div>
                `;
            }

            // Common parameters
            html += `
                <div class="input-group">
                    <label>Tolerance:</label>
                    <input type="number" id="tolerance" step="any" value="0.0001" placeholder="e.g., 0.0001">
                </div>
                <div class="input-group">
                    <label>Max Iterations:</label>
                    <input type="number" id="max_iterations" value="50" placeholder="e.g., 50">
                </div>
            `;

            inputFields.innerHTML = html;
        }

        async function solveEquation() {
            const method = document.getElementById('method').value;
            const errorMessage = document.getElementById('errorMessage');
            const results = document.getElementById('results');
            const loading = document.getElementById('loading');

            errorMessage.classList.remove('show');
            results.classList.remove('show');

            const data = {
                method: method,
                equation: document.getElementById('equation').value,
                tolerance: document.getElementById('tolerance').value,
                max_iterations: document.getElementById('max_iterations').value
            };

            // Add method-specific parameters
            if (method === 'bisection' || method === 'regula_falsi') {
                data.a = document.getElementById('a').value;
                data.b = document.getElementById('b').value;
            } else if (method === 'secant') {
                data.x0 = document.getElementById('x0').value;
                data.x1 = document.getElementById('x1').value;
            } else if (method === 'newton_raphson') {
                data.x0 = document.getElementById('x0').value;
            } else if (method === 'fixed_point') {
                data.g_equation = document.getElementById('g_equation').value;
                data.x0 = document.getElementById('x0').value;
            } else if (method === 'modified_secant') {
                data.x0 = document.getElementById('x0').value;
                data.delta = document.getElementById('delta').value;
            }

            loading.classList.add('show');

            try {
                const response = await fetch('/solve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                loading.classList.remove('show');

                if (result.error) {
                    errorMessage.textContent = result.error;
                    errorMessage.classList.add('show');
                    return;
                }

                displayResults(result);
            } catch (error) {
                loading.classList.remove('show');
                errorMessage.textContent = 'An error occurred: ' + error.message;
                errorMessage.classList.add('show');
            }
        }

        function displayResults(result) {
            const resultSummary = document.getElementById('resultSummary');
            const iterationsTable = document.getElementById('iterationsTable');
            const results = document.getElementById('results');

            resultSummary.innerHTML = `
                <h2>✓ Solution Found</h2>
                <div class="result-item">
                    <span><strong>Estimated Root:</strong></span>
                    <span>${result.root}</span>
                </div>
                <div class="result-item">
                    <span><strong>f(root):</strong></span>
                    <span>${result.f_root}</span>
                </div>
                <div class="result-item">
                    <span><strong>Final Error:</strong></span>
                    <span>${result.final_error}</span>
                </div>
                <div class="result-item">
                    <span><strong>Number of Iterations:</strong></span>
                    <span>${result.num_iterations}</span>
                </div>
            `;

            // Build table
            let tableHTML = '<thead><tr>';
            const headers = Object.keys(result.iterations[0]);
            headers.forEach(header => {
                tableHTML += `<th>${header}</th>`;
            });
            tableHTML += '</tr></thead><tbody>';

            result.iterations.forEach(row => {
                tableHTML += '<tr>';
                headers.forEach(header => {
                    tableHTML += `<td>${row[header]}</td>`;
                });
                tableHTML += '</tr>';
            });
            tableHTML += '</tbody>';

            iterationsTable.innerHTML = tableHTML;
            results.classList.add('show');
        }
    </script>
</body>
</html>
